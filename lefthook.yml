# Lefthook - Git Hooks 設定
# https://github.com/evilmartians/lefthook

pre-commit:
  piped: true # oxlint --fix → oxfmt の順で同一ファイルに書き込むため直列実行
  commands:
    1_oxlint:
      glob: "*.{js,ts,cjs,mjs,jsx,tsx}"
      # .oxlintrc.json の ignorePatterns（apps/client/components/ui/** 等）で
      # staged_files が全て除外されると unmatched-pattern エラーで非0終了する
      # （下の oxfmt と違いこのフラグが無かった）。shadcn 生成コード単独のコミットが
      # pre-commit で必ず失敗するため必須。
      run: bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    2_oxfmt:
      glob: "*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc,css}"
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

# Conventional Commits の検証（規約は commitlint.config.mjs）
commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    check-all:
      run: CI=true SKIP_KNIP=1 bun run check-all
