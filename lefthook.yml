# Lefthook - Git Hooks 設定
# https://github.com/evilmartians/lefthook

pre-commit:
  piped: true # oxlint --fix → biome format の順で同一ファイルに書き込むため直列実行
  commands:
    1_oxlint:
      glob: "*.{js,ts,cjs,mjs,jsx,tsx}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    2_biome-format:
      glob: "*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

pre-push:
  commands:
    check-all:
      run: CI=true SKIP_KNIP=1 bun run check-all
