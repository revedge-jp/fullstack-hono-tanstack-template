# minimumReleaseAge: 公開から一定時間(秒)経っていないパッケージ版をインストールしない。
# 2026年に相次いだ npm サプライチェーン攻撃(axios 汚染は約3時間、trivy-action は 76/77 タグ
# 改竄)はいずれも「公開直後の数時間」が露出窓だった。3日(259200秒)待てば、汚染版は
# 大半が取り下げ・報告済みになる。pnpm は v11 で既定 1日、npm も 11.10 で導入済み。
# 既存の lockfile に固定された版には影響しない(新規追加・更新時のみ効く)。
# 緊急のセキュリティ修正を即日取り込みたい場合は、そのパッケージだけ
# minimumReleaseAgeExcludes に一時的に足す(理由をコメントし、取り込み後に外す)。
[install]
minimumReleaseAge = 259200
