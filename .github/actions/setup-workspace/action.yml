name: 'Setup Workspace'
description: 'Setup bun/node, restore caches, and install dependencies'

inputs:
  bun-version:
    description: 'Bun version to install'
    required: false
    default: '1.3.9'
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '22'
  install-playwright:
    description: 'Install Playwright browsers (chromium)'
    required: false
    default: 'false'
  playwright-cache-hit:
    description: 'Whether Playwright browser cache was restored (skip browser download if true)'
    required: false
    default: 'false'
  generate-prisma:
    description: 'Generate Prisma client if cache miss'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore node_modules cache
      id: nm-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-nm-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-nm-

    - name: Install dependencies
      if: steps.nm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile

    - name: Save node_modules cache
      if: steps.nm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-nm-${{ hashFiles('bun.lock') }}

    - name: Restore Prisma cache
      id: prisma-cache
      if: inputs.generate-prisma == 'true'
      uses: actions/cache/restore@v4
      with:
        path: packages/database/prisma/generated
        key: ${{ runner.os }}-prisma-${{ hashFiles('packages/database/prisma/schema.prisma', 'packages/database/prisma/**/*.prisma') }}
        restore-keys: |
          ${{ runner.os }}-prisma-

    - name: Generate Prisma Client
      if: inputs.generate-prisma == 'true' && steps.prisma-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cd packages/database && bun run db:generate
      env:
        DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

    - name: Save Prisma cache
      if: inputs.generate-prisma == 'true' && steps.prisma-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: packages/database/prisma/generated
        key: ${{ runner.os }}-prisma-${{ hashFiles('packages/database/prisma/schema.prisma', 'packages/database/prisma/**/*.prisma') }}

    # Playwright のインストールを2段階に分離:
    # - OS 依存パッケージ（libnss3 等）: runner は新規 VM のため毎回必要
    # - ブラウザバイナリ: ~/.cache/ms-playwright がキャッシュヒットならスキップ可能
    - name: Install Playwright OS dependencies
      if: inputs.install-playwright == 'true'
      shell: bash
      run: bunx playwright install-deps chromium

    - name: Install Playwright browsers
      if: inputs.install-playwright == 'true' && inputs.playwright-cache-hit != 'true'
      shell: bash
      run: bunx playwright install chromium
