name: 'Get DB Password'
description: 'Get database password from Secret Manager (database-url) or GitHub Secret fallback'

inputs:
  project_id:
    description: 'GCP Project ID'
    required: true
  prefix:
    description: 'Resource prefix for secret name (e.g., ax, my-app). Secret name becomes ${prefix}-database-url'
    required: true
  fallback_password:
    description: 'Fallback password from GitHub Secret (STG_DB_PASSWORD or PRD_DB_PASSWORD)'
    required: false
    default: ''

outputs:
  DB_PASSWORD:
    description: 'The database password'
    value: ${{ steps.get-password.outputs.DB_PASSWORD }}

runs:
  using: 'composite'
  steps:
    - name: Get DB password from database-url or secret
      id: get-password
      shell: bash
      env:
        PROJECT_ID: ${{ inputs.project_id }}
        PREFIX: ${{ inputs.prefix }}
        FALLBACK_PASSWORD: ${{ inputs.fallback_password }}
      run: |
        set -eo pipefail
        echo "=== Getting DB Password ==="
        echo ""

        # シークレット名は ${PREFIX}-database-url
        SECRET_NAME="${PREFIX}-database-url"

        # まずdatabase-urlからパスワードを取得を試行
        echo "Trying to get password from ${SECRET_NAME}..."
        set +e
        DATABASE_URL=$(gcloud secrets versions access latest \
          --secret="${SECRET_NAME}" \
          --project="${PROJECT_ID}" 2>&1)
        SECRET_CODE=${PIPESTATUS[0]}
        set -e

        if [ ${SECRET_CODE} -eq 0 ] && [ -n "${DATABASE_URL}" ]; then
          echo "  database-url found"
          # database-urlからパスワードを抽出
          PASSWORD=$(echo "${DATABASE_URL}" | sed -n 's|postgresql://[^:]*:\([^@]*\)@.*|\1|p' | python3 -c 'import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))' 2>/dev/null || echo "")
          if [ -n "${PASSWORD}" ]; then
            echo "  Password extracted from database-url"
            echo "::add-mask::${PASSWORD}"
            echo "DB_PASSWORD=${PASSWORD}" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "  Password is empty in database-url"
            echo "  Falling back to GitHub Secret"
          fi
        fi

        # database-urlがない場合、フォールバックシークレットを使用
        echo "  database-url not found or empty, trying fallback secret..."
        if [ -n "${FALLBACK_PASSWORD}" ]; then
          echo "  Using fallback password from GitHub Secret"
          echo "::add-mask::${FALLBACK_PASSWORD}"
          echo "DB_PASSWORD=${FALLBACK_PASSWORD}" >> $GITHUB_OUTPUT
        else
          echo "Error: Neither database-url nor fallback password found"
          echo "  Ensure either ${SECRET_NAME} exists in Secret Manager"
          echo "  or the fallback GitHub Secret is configured"
          exit 1
        fi
