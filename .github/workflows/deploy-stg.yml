name: deploy-stg
# 初期状態では無効化されています
# 有効化する場合は、以下のコメントアウトを解除してください
# on:
#   workflow_run:
#     workflows: ["CI Pipeline"]
#     types:
#       - completed
#     branches: [main]
on:
  workflow_dispatch: # 手動実行のみ可能（デフォルトは無効）

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-stg
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: stg
      commit_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      prefix: ${{ vars.PREFIX }}
      GCP_PROJECT_ID: ${{ vars.STG_GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ vars.STG_WIF_PROVIDER }}
      WIF_SA: ${{ vars.STG_WIF_SA }}
      TFSTATE_BUCKET: ${{ vars.STG_TFSTATE_BUCKET }}
      load_balancer_domain: ${{ vars.STG_LOAD_BALANCER_DOMAIN }}
    secrets:
      DB_PASSWORD: ${{ secrets.STG_DB_PASSWORD }}
