name: CI Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

env:
  TURBO_TELEMETRY_DISABLED: "1"
  BUN_VERSION: "1.3.9"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      client: ${{ steps.filter.outputs.client }}
      api-service: ${{ steps.filter.outputs.api-service }}
      packagesAll: ${{ steps.filter.outputs.packagesAll }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'apps/client/**'
              - 'apps/api-service/**'
              - 'packages/typescript-config/**'
              - 'packages/tailwind-config/**'
            api-service:
              - 'apps/api-service/**'
              - 'packages/database/**'
            packagesAll:
              - 'packages/**'
            deps:
              - '**/package.json'
              - 'bun.lock'

  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.api-service == 'true' || needs.changes.outputs.packagesAll == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Turbo cache
        id: turbo-cache-ci
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref }}-${{ hashFiles('**/turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref }}-
            ${{ runner.os }}-turbo-refs/heads/main-
            ${{ runner.os }}-turbo-

      - name: Run CI Quality Checks
        env:
          CI: true
        run: |
          set -euo pipefail
          FILTERS=""
          if [[ "${{ needs.changes.outputs.client }}" == "true" ]]; then
            FILTERS="$FILTERS --filter=client"
          fi
          if [[ "${{ needs.changes.outputs.api-service }}" == "true" ]]; then
            FILTERS="$FILTERS --filter=api-service"
          fi

          if [[ -z "$FILTERS" ]]; then
            echo "No specific app changes; running lint/typecheck across repo"
            bunx turbo run lint typecheck --concurrency=4 --cache-dir=.turbo
          else
            echo "Running lint/typecheck for changed packages: $FILTERS"
            bunx turbo run lint typecheck --concurrency=4 --cache-dir=.turbo $FILTERS
          fi

          # api-service のユニットテストのみ（DB不要）
          if [[ "${{ needs.changes.outputs.api-service }}" == "true" ]]; then
            echo "Running api-service unit tests with coverage"
            bunx turbo run test:unit --concurrency=2 --cache-dir=.turbo --filter=api-service -- --coverage
          else
            echo "Skip unit tests (api-service unchanged)"
          fi

      - name: Run contract / scenario / client unit tests
        if: needs.changes.outputs.client == 'true' || needs.changes.outputs.api-service == 'true'
        env:
          CI: true
        run: bunx turbo run test:unit test:contract --concurrency=4 --cache-dir=.turbo --continue

      - name: Unit coverage threshold (domain/application)
        if: needs.changes.outputs.api-service == 'true'
        run: bun run coverage:check

      - name: Mutation testing (domain/application)
        if: needs.changes.outputs.api-service == 'true'
        run: cd apps/api-service && bun run mutation

      - name: Client coverage threshold (actions/queries)
        if: needs.changes.outputs.client == 'true'
        run: bun run coverage:check:client

      - name: Architecture & FSD Checks
        run: |
          echo "Running Architecture & FSD Checks..."
          SKIP_KNIP=1 bash scripts/check/architecture-check.sh

      - name: Unused Code Check (Knip)
        if: github.event_name == 'pull_request'
        id: knip
        run: |
          set -euo pipefail
          NO_COLOR=1 bunx knip > knip-raw.txt 2>&1 || true
          UNUSED_FILES=$(grep -E "^Unused files \([0-9]+\)" knip-raw.txt | sed -E 's/.*\(([0-9]+)\).*/\1/' || echo "0")
          UNUSED_DEPS=$(grep -E "^Unused (dependencies|devDependencies) \([0-9]+\)" knip-raw.txt | sed -E 's/.*\(([0-9]+)\).*/\1/' | paste -sd+ | bc 2>/dev/null || echo "0")
          UNUSED_EXPORTS=$(grep -E "^Unused exports \([0-9]+\)" knip-raw.txt | sed -E 's/.*\(([0-9]+)\).*/\1/' || echo "0")
          UNUSED_FILES=${UNUSED_FILES:-0}
          UNUSED_DEPS=${UNUSED_DEPS:-0}
          UNUSED_EXPORTS=${UNUSED_EXPORTS:-0}
          {
            echo "## Unused Code Check Results";
            echo;
            echo "### Summary";
            echo;
            echo "| Item | Count |";
            echo "|------|-------|";
            echo "| Unused files | $UNUSED_FILES |";
            echo "| Unused dependencies | $UNUSED_DEPS |";
            echo "| Unused exports | $UNUSED_EXPORTS |";
            echo;
            if [ "$UNUSED_FILES" != "0" ] || [ "$UNUSED_DEPS" != "0" ] || [ "$UNUSED_EXPORTS" != "0" ]; then
              echo "### Warning: Unused code detected";
              echo;
              echo "<details>";
              echo "<summary>Knip output</summary>";
              echo;
              echo '```';
              head -n 1000 knip-raw.txt || true;
              echo '```';
              echo "</details>";
            else
              echo "### OK: No unused code detected";
            fi
          } > knip-report.md

      - name: Post Knip result as PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('knip-report.md', 'utf8');
            const marker = '## Unused Code Check Results';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const botComment = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload unit test coverage (api-service)
        if: needs.changes.outputs.api-service == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-api-service
          path: apps/api-service/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Build changed packages for PR
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          set -euo pipefail
          FILTERS=""
          if [[ "${{ needs.changes.outputs.client }}" == "true" ]]; then
            FILTERS="$FILTERS --filter=client"
          fi
          if [[ "${{ needs.changes.outputs.api-service }}" == "true" ]]; then
            FILTERS="$FILTERS --filter=api-service"
          fi
          if [[ -z "$FILTERS" ]]; then
            echo "No changes detected, skip build"
          else
            # テンプレート未置換の {{APP_NAME}} を CI ビルド検証用のダミー値に置換
            # (wrangler は name に英数+ハイフンしか許可しないため)
            if grep -q '{{APP_NAME}}' apps/client/wrangler.jsonc; then
              echo "Replacing {{APP_NAME}} placeholder with CI dummy value"
              sed -i 's/{{APP_NAME}}/template-app/g' apps/client/wrangler.jsonc
            fi
            echo "Building changed packages: $FILTERS"
            bunx turbo run build --concurrency=4 --cache-dir=.turbo $FILTERS
          fi

      - name: Save Turbo cache after build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref }}-${{ hashFiles('**/turbo.json', '**/package.json') }}

  e2e-tests:
    # dev: 開発サーバー（vite dev）に対して実行 — 失敗時のデバッグが容易。
    # prod-shape: ビルド成果物（SSR + API が 1 Worker に同居）を workerd で起動して実行 —
    #   dev（Bun / vite dev）と本番（workerd）のランタイム乖離をデプロイ前に検出する。
    #   詳細は apps/client/playwright.config.ts を参照。
    name: E2E Tests (Playwright, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.client == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, prod-shape]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v2-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-v2-

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-playwright: 'true'
          playwright-cache-hit: ${{ steps.playwright-cache.outputs.cache-hit }}

      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v2-${{ hashFiles('**/bun.lock') }}

      - name: Run database migrations
        working-directory: packages/database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
        run: bunx drizzle-kit migrate

      - name: Replace {{APP_NAME}} placeholder for E2E
        run: |
          if grep -q '{{APP_NAME}}' apps/client/wrangler.jsonc; then
            sed -i 's/{{APP_NAME}}/template-app/g' apps/client/wrangler.jsonc
          fi

      - name: Create .dev.vars for E2E
        run: |
          # prod-shape は 3100 で起動する（playwright.config.ts と揃える）
          PORT=3000
          if [ "${{ matrix.mode }}" = "prod-shape" ]; then PORT=3100; fi
          cat > apps/client/.dev.vars << VARS
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/app_db
          BETTER_AUTH_SECRET=dummy-secret-for-e2e-0123456789abcdef
          BETTER_AUTH_URL=http://localhost:${PORT}
          GOOGLE_CLIENT_ID=dummy-client-id
          GOOGLE_CLIENT_SECRET=dummy-client-secret
          VARS

      - name: Run E2E tests
        working-directory: apps/client
        env:
          CI: true
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
          BETTER_AUTH_SECRET: dummy-secret-for-e2e-0123456789abcdef
          E2E_PROD_SHAPE: ${{ matrix.mode == 'prod-shape' && '1' || '' }}
        run: bunx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.mode }}
          path: apps/client/playwright-report
          retention-days: 14

  api-service-integration-tests:
    name: API Service Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api-service == 'true'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 15432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Prepare database schema
        run: |
          cd packages/database
          DATABASE_URL="postgresql://postgres:postgres@localhost:15432/test_db" bun run db:migrate

      - name: Run api-service integration tests (with coverage)
        working-directory: apps/api-service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/test_db
          CI: true
        run: bun run coverage:integration

      - name: Upload integration test coverage (api-service)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-api-service
          path: apps/api-service/coverage
          if-no-files-found: ignore
          retention-days: 14

  # docs/.md のみの変更でもステータスを報告するためのジョブ
  # GitHub Rulesetで "CI Pipeline" が必須チェックになっているため
  ci-status:
    name: CI Pipeline
    runs-on: ubuntu-latest
    needs: [changes, ci, api-service-integration-tests, e2e-tests]
    if: always()
    steps:
      - name: Check CI status
        run: |
          echo "CI result: ${{ needs.ci.result }}"
          echo "Integration tests result: ${{ needs.api-service-integration-tests.result }}"
          echo "E2E tests result: ${{ needs.e2e-tests.result }}"

          # failure があれば失敗
          if [[ "${{ needs.ci.result }}" == "failure" ]]; then
            echo "CI checks failed"
            exit 1
          fi
          if [[ "${{ needs.api-service-integration-tests.result }}" == "failure" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-tests.result }}" == "failure" ]]; then
            echo "E2E tests failed"
            exit 1
          fi

          echo "All required checks passed or were skipped"
