name: CI Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, develop]
  # merge queue が作る一時ブランチ(main + キュー内の PR)で CI Pipeline を走らせる。
  # これが無いとキューは永久に待つ。詳細は docs/deploy/github-ruleset.md
  merge_group:

permissions:
  contents: read
  pull-requests: write

env:
  TURBO_TELEMETRY_DISABLED: "1"
  BUN_VERSION: "1.4.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # merge_group(キュー上の検証)では paths-filter の比較対象が無いので全部 true にして全ジョブを回す。
    # キューに入るのはマージ直前の 1 回だけなので、ここで絞る意味は薄い
    outputs:
      client: ${{ github.event_name == 'merge_group' || steps.filter.outputs.client == 'true' }}
      api-service: ${{ github.event_name == 'merge_group' || steps.filter.outputs.api-service == 'true' }}
      packagesAll: ${{ github.event_name == 'merge_group' || steps.filter.outputs.packagesAll == 'true' }}
      deps: ${{ github.event_name == 'merge_group' || steps.filter.outputs.deps == 'true' }}
      workflows: ${{ github.event_name == 'merge_group' || steps.filter.outputs.workflows == 'true' }}
    steps:
      # persist-credentials を無効化しない: paths-filter は pull_request では GitHub API を使うが、
      # push イベントでは比較対象コミットを git fetch で取得するため、private リポジトリでは
      # checkout が残した認証情報が必要（無効化すると main への push で exit 128 になる）。
      # このジョブは push を行わず、後続 step も paths-filter のみなのでリスクは限定的。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        if: github.event_name != 'merge_group'
        id: filter
        with:
          filters: |
            client:
              - 'apps/client/**'
              - 'apps/api-service/**'
              - 'packages/typescript-config/**'
              - 'packages/tailwind-config/**'
            api-service:
              - 'apps/api-service/**'
              - 'packages/database/**'
            packagesAll:
              - 'packages/**'
            deps:
              - '**/package.json'
              - 'bun.lock'
            workflows:
              - '.github/workflows/**'

  # 検証器(ゲート・ガード・CI・フック・閾値)に触る PR は本文に理由を要求する。
  # エージェントがゲートに引っかかったとき「コードを直す」ではなく「ゲートを緩める」に流れるのを、
  # 編集時(Claude Code の PreToolUse フック)だけでなくマージ時にも止める。Bash 経由・他エージェント・
  # 手編集もここで同じ一覧(scripts/check/verifier-paths.txt)に当たる。
  # Renovate の PR は検証器一覧に当たるファイル(ルート package.json、.github/workflows/* の
  # action digest 更新)を触るが「検証器の緩和」ではないので対象外。bot の PR は依存の bump しか
  # 含まない前提(renovate.json の automerge 条件と同じ範囲)。
  # 注意: エージェントが bot トークンで PR を作る運用(claude-code-action 等)を導入するなら、
  # その bot はこのゲートが本来止めたい対象なので、除外を renovate[bot] だけに絞ること。
  verifier-change:
    name: Verifier change reason
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 検証器の変更に理由があるか
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          [ -z "$changed" ] && { echo "変更なし"; exit 0; }
          # shellcheck disable=SC2086
          if ! hits=$(bash scripts/check/is-verifier-path.sh $changed); then
            echo "検証器の変更なし"; exit 0
          fi
          echo "検証器に当たる変更:"
          while IFS= read -r hit; do echo "  • $hit"; done <<< "$hits"
          if printf '%s' "$PR_BODY" | grep -q '^## 検証器の変更理由'; then
            echo "PR 本文に「## 検証器の変更理由」あり"; exit 0
          fi
          echo "::error::検証器(上記)を変更していますが、PR 本文に「## 検証器の変更理由」節がありません。閾値の引き下げ・除外の追加・ガードの削除がコードを直す代わりになっていないかを書いてください(一覧: scripts/check/verifier-paths.txt)"
          exit 1

  # レビューが収束した PR だけをマージ対象にする。auto-merge / merge queue を使うと「CI 緑」だけで
  # 入ってしまうため、ship.md の手順どおり /code-review を CONFIRMED ゼロまで回した証跡
  # (本文の「レビュー収束:」行)を要求する。行は人が書くので偽装は可能だが、「書かずに通る」経路を塞ぐ。
  # bot の依存更新 PR は対象外。
  review-converged:
    name: Review converged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - name: PR 本文にレビュー収束の記録があるか
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -qE '^レビュー収束: .*CONFIRMED 0'; then
            echo "レビュー収束の記録あり"; exit 0
          fi
          echo "::error::PR 本文に「レビュー収束: 最終周 CONFIRMED 0」の行がありません。/code-review を CONFIRMED ゼロまで回してから、ship.md の手順で本文に記録してください(Draft のまま作業中なら、この失敗は無視してよい)"
          exit 1

  # ワークフローファイルの構文・式を検証する。YAML としては valid でも GitHub Actions として
  # 無効なファイル（例: run の plain scalar 中の「: 」）は main に入って初めて
  # 「This run likely failed because of a workflow file issue」で発覚するため、PR の段階で検出する。
  workflow-lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      # SC2086 は意図的な word splitting（$FILTERS 展開等）への info 警告のため除外。
      # docker:// アクションはシェルを介さず args を渡すため、クォートは付けない（リテラルになる）
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -ignore SC2086

  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    # deps（ルートの package.json / bun.lock）変更時も必ず走らせる。ここを外すと
    # Renovate の devDeps 自動マージがビルド/テストを素通りする。
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.api-service == 'true' || needs.changes.outputs.packagesAll == 'true' || needs.changes.outputs.deps == 'true'
    steps:
      # fetch-depth: 0（フル履歴）+ persist-credentials: true は mutation testing の
      # diff スコープ算出（git diff origin/main...HEAD、ADR-007）に必要。
      # persist-credentials は private リポジトリでの git fetch に必要で、
      # このジョブは push を行わないため changes ジョブと同じ理由でリスクは限定的。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Turbo cache
        id: turbo-cache-ci
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          # key に github.sha を含めて run ごとに一意にする（save 側と揃える）。
          # Turbo のタスクハッシュキャッシュは ref が同じでも中身が更新されるため、
          # 不変キーのままだと最初の run 以降 save がスキップされ続けキャッシュが陳腐化する。
          # restore は restore-keys の prefix フォールバックで直近のキャッシュを取得する。
          #
          # hashFiles に `**/` グロブを使わないこと。hashFiles は node_modules を除外しない
          # ため、`**/package.json` は実体十数個に対して node_modules 内の千個以上を舐める。
          # しかもこの式が評価されるのは step の with: が展開される直前 = node_modules を
          # 復元し終えた後なので、ログに何も出ない空白時間として現れる（実測で約36秒/run）。
          # turbo.json はルートに1つだけ。依存の変更は必ず bun.lock に出るのでこの2つで足りる
          # （各パッケージの package.json の中身は turbo 自身のタスクハッシュが見ている）。
          key: ${{ runner.os }}-turbo-${{ github.ref }}-${{ hashFiles('turbo.json', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref }}-${{ hashFiles('turbo.json', 'bun.lock') }}-
            ${{ runner.os }}-turbo-${{ github.ref }}-
            ${{ runner.os }}-turbo-refs/heads/main-
            ${{ runner.os }}-turbo-

      - name: Run CI Quality Checks
        env:
          CI: true
        run: |
          set -euo pipefail
          FILTERS=""
          if [[ "${{ needs.changes.outputs.client }}" == "true" ]]; then
            FILTERS="$FILTERS --filter=client"
          fi
          if [[ "${{ needs.changes.outputs.api-service }}" == "true" ]]; then
            FILTERS="$FILTERS --filter=api-service"
          fi

          if [[ -z "$FILTERS" ]]; then
            echo "No specific app changes; running lint/typecheck across repo"
            bunx turbo run lint typecheck --concurrency=4 --cache-dir=.turbo
          else
            echo "Running lint/typecheck for changed packages: $FILTERS"
            bunx turbo run lint typecheck --concurrency=4 --cache-dir=.turbo $FILTERS
          fi

          # api-service のユニットテストのみ（DB不要）
          if [[ "${{ needs.changes.outputs.api-service }}" == "true" ]]; then
            echo "Running api-service unit tests with coverage"
            bunx turbo run test:unit --concurrency=2 --cache-dir=.turbo --filter=api-service -- --coverage
          else
            echo "Skip unit tests (api-service unchanged)"
          fi

      - name: Run contract / scenario / client unit tests
        if: needs.changes.outputs.client == 'true' || needs.changes.outputs.api-service == 'true'
        env:
          CI: true
        run: bunx turbo run test:unit test:contract --concurrency=4 --cache-dir=.turbo --continue

      - name: Unit coverage threshold (domain/application)
        if: needs.changes.outputs.api-service == 'true'
        run: bun run coverage:check

      - name: Mutation testing (domain/application, diff scope)
        if: needs.changes.outputs.api-service == 'true'
        run: cd apps/api-service && bun run mutation:diff

      - name: Client coverage threshold (actions/queries)
        if: needs.changes.outputs.client == 'true'
        run: bun run coverage:check:client

      - name: Architecture & FSD Checks
        run: |
          echo "Running Architecture & FSD Checks..."
          SKIP_KNIP=1 bash scripts/check/architecture-check.sh

      - name: Unused Code Check (Knip)
        if: github.event_name == 'pull_request'
        id: knip
        run: |
          set -euo pipefail
          NO_COLOR=1 bunx knip > knip-raw.txt 2>&1 || true
          UNUSED_FILES=$(grep -E "^Unused files \([0-9]+\)" knip-raw.txt | sed -E 's/.*\(([0-9]+)\).*/\1/' || echo "0")
          UNUSED_DEPS=$(grep -E "^Unused (dependencies|devDependencies) \([0-9]+\)" knip-raw.txt | sed -E 's/.*\(([0-9]+)\).*/\1/' | paste -sd+ | bc 2>/dev/null || echo "0")
          UNUSED_EXPORTS=$(grep -E "^Unused exports \([0-9]+\)" knip-raw.txt | sed -E 's/.*\(([0-9]+)\).*/\1/' || echo "0")
          UNUSED_FILES=${UNUSED_FILES:-0}
          UNUSED_DEPS=${UNUSED_DEPS:-0}
          UNUSED_EXPORTS=${UNUSED_EXPORTS:-0}
          {
            echo "## Unused Code Check Results";
            echo;
            echo "### Summary";
            echo;
            echo "| Item | Count |";
            echo "|------|-------|";
            echo "| Unused files | $UNUSED_FILES |";
            echo "| Unused dependencies | $UNUSED_DEPS |";
            echo "| Unused exports | $UNUSED_EXPORTS |";
            echo;
            if [ "$UNUSED_FILES" != "0" ] || [ "$UNUSED_DEPS" != "0" ] || [ "$UNUSED_EXPORTS" != "0" ]; then
              echo "### Warning: Unused code detected";
              echo;
              echo "<details>";
              echo "<summary>Knip output</summary>";
              echo;
              echo '```';
              head -n 1000 knip-raw.txt || true;
              echo '```';
              echo "</details>";
            else
              echo "### OK: No unused code detected";
            fi
          } > knip-report.md

      - name: Post Knip result as PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('knip-report.md', 'utf8');
            const marker = '## Unused Code Check Results';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const botComment = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # knip の Unlisted binaries / Unresolved imports は knip の exit code を 1 にするため、
      # ローカルの `bun run arch:check` と pre-push(check-all)が全開発者で落ちる。上の step は
      # exit code を捨てている(`|| true`)ので、この2カテゴリだけ明示的に落とす。
      # (外部 CLI を呼ぶスクリプトの追加 PR が緑のままマージされ、main 取り込み後に全員の
      # プッシュが塞がる事故の再発防止)
      - name: Fail on knip issues that break local checks
        if: steps.knip.outcome == 'success'
        run: |
          set -euo pipefail
          BLOCKING=$(grep -E "^(Unlisted binaries|Unresolved imports) \([0-9]+\)" knip-raw.txt || true)
          if [ -n "$BLOCKING" ]; then
            echo "::error::knip がローカルの arch:check / pre-push を塞ぐ問題を検出しました。knip.json の ignoreBinaries 等で宣言してください。"
            grep -A 20 -E "^(Unlisted binaries|Unresolved imports) \(" knip-raw.txt || true
            exit 1
          fi
          echo "OK: ローカルのチェックを塞ぐ knip の問題はありません"

      - name: Upload unit test coverage (api-service)
        if: needs.changes.outputs.api-service == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit-api-service
          path: apps/api-service/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Build changed packages for PR
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          set -euo pipefail
          FILTERS=""
          if [[ "${{ needs.changes.outputs.client }}" == "true" ]]; then
            FILTERS="$FILTERS --filter=client"
          fi
          if [[ "${{ needs.changes.outputs.api-service }}" == "true" ]]; then
            FILTERS="$FILTERS --filter=api-service"
          fi
          if [[ -z "$FILTERS" ]]; then
            echo "No changes detected, skip build"
          else
            # テンプレート未置換の {{APP_NAME}} を CI ビルド検証用のダミー値に置換
            # (wrangler は name に英数+ハイフンしか許可しないため)
            if grep -q '{{APP_NAME}}' apps/client/wrangler.jsonc; then
              echo "Replacing {{APP_NAME}} placeholder with CI dummy value"
              sed -i 's/{{APP_NAME}}/template-app/g' apps/client/wrangler.jsonc
            fi
            echo "Building changed packages: $FILTERS"
            bunx turbo run build --concurrency=4 --cache-dir=.turbo $FILTERS
          fi

      - name: Save Turbo cache after build
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          # restore と同じ run 一意キー。github.sha を含めることで毎 run 新しいキャッシュが
          # 保存され（不変キーだと GitHub Actions Cache は上書き不可のため save が no-op になる）、
          # 更新された Turbo キャッシュが次 run 以降に引き継がれる。
          key: ${{ runner.os }}-turbo-${{ github.ref }}-${{ hashFiles('turbo.json', 'bun.lock') }}-${{ github.sha }}

  e2e-tests:
    # dev: 開発サーバー（vite dev）に対して実行 — 失敗時のデバッグが容易。
    # prod-shape: ビルド成果物（SSR + API が 1 Worker に同居）を workerd で起動して実行 —
    #   dev（Bun / vite dev）と本番（workerd）のランタイム乖離をデプロイ前に検出する。
    #   詳細は apps/client/playwright.config.ts を参照。
    name: E2E Tests (Playwright, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.deps == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, prod-shape]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-v2-

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-playwright: 'true'
          playwright-cache-hit: ${{ steps.playwright-cache.outputs.cache-hit }}

      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v2-${{ hashFiles('bun.lock') }}

      - name: Run database migrations
        working-directory: packages/database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
        run: bunx drizzle-kit migrate

      - name: Replace {{APP_NAME}} placeholder for E2E
        run: |
          if grep -q '{{APP_NAME}}' apps/client/wrangler.jsonc; then
            sed -i 's/{{APP_NAME}}/template-app/g' apps/client/wrangler.jsonc
          fi

      - name: Create .dev.vars for E2E
        run: |
          # ポートは playwright.config.ts と揃える（dev: 3200 / prod-shape: 3100）
          PORT=3200
          if [ "${{ matrix.mode }}" = "prod-shape" ]; then PORT=3100; fi
          cat > apps/client/.dev.vars << VARS
          NODE_ENV=development
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/app_db
          BETTER_AUTH_SECRET=dummy-secret-for-e2e-0123456789abcdef
          BETTER_AUTH_URL=http://localhost:${PORT}
          GOOGLE_CLIENT_ID=dummy-client-id
          GOOGLE_CLIENT_SECRET=dummy-client-secret
          VARS

      - name: Run E2E tests
        working-directory: apps/client
        env:
          CI: true
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
          BETTER_AUTH_SECRET: dummy-secret-for-e2e-0123456789abcdef
          E2E_PROD_SHAPE: ${{ matrix.mode == 'prod-shape' && '1' || '' }}
        run: bunx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.mode }}
          path: apps/client/playwright-report
          retention-days: 14

  api-service-integration-tests:
    name: API Service Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api-service == 'true' || needs.changes.outputs.deps == 'true'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 15432:5432
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Prepare database schema
        run: |
          cd packages/database
          DATABASE_URL="postgresql://postgres:postgres@localhost:15432/test_db" bun run db:migrate

      - name: Run api-service integration tests (with coverage)
        working-directory: apps/api-service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/test_db
          CI: true
        run: bun run coverage:integration

      - name: Upload integration test coverage (api-service)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration-api-service
          path: apps/api-service/coverage
          if-no-files-found: ignore
          retention-days: 14

  # docs/.md のみの変更でもステータスを報告するためのジョブ
  # GitHub Rulesetで "CI Pipeline" が必須チェックになっているため
  ci-status:
    name: CI Pipeline
    runs-on: ubuntu-latest
    needs: [changes, ci, api-service-integration-tests, e2e-tests, workflow-lint, verifier-change, review-converged]
    if: always()
    steps:
      - name: Check CI status
        run: |
          # failure だけでなく cancelled / timed_out も失敗として扱う。
          # cancelled を pass 扱いにすると、必須チェックをキャンセルすればゲートを
          # 素通りできてしまう（success / skipped のみ通過を許可する）。
          fail=0
          for entry in \
            "Workflow lint:${{ needs.workflow-lint.result }}" \
            "Verifier change:${{ needs.verifier-change.result }}" \
            "Review converged:${{ needs.review-converged.result }}" \
            "CI checks:${{ needs.ci.result }}" \
            "Integration tests:${{ needs.api-service-integration-tests.result }}" \
            "E2E tests:${{ needs.e2e-tests.result }}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            echo "$name result: $result"
            case "$result" in
              failure | cancelled | timed_out)
                echo "::error::$name did not pass (result: $result)"
                fail=1
                ;;
            esac
          done

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi

          echo "All required checks passed or were skipped"
