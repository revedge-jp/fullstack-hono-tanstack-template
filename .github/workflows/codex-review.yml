name: Codex AI Review

# Trigger: PR opened/synchronized targeting main or develop
# Prerequisites: CODEX_REVIEW_API_KEY secret must be configured in repository settings.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# 同一 PR で push が連続したら古いレビューをキャンセルして最新の diff だけをレビューする。
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    name: Codex Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: openai/codex-action@94bb7a052e529936e5260a35838e61b190855739 # v1
        with:
          api_key: ${{ secrets.CODEX_REVIEW_API_KEY }}
          sandbox: read-only
