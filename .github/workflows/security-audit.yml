name: Security Audit

on:
  schedule:
    # 毎週月曜日の朝9時（JST）に実行 = UTC 0:00（月曜日）
    - cron: '0 0 * * 1'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: read
  issues: write

env:
  BUN_VERSION: "1.3.9"

jobs:
  bun-audit:
    name: Security Audit (bun audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        id: bun-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.bun
            ~/.cache/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Save Bun cache
        if: steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.bun
            ~/.cache/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Run bun audit
        id: audit
        run: |
          set +e
          bun audit > audit-output.txt 2>&1
          STATUS=$?
          set -e
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "has_vulnerabilities=$([[ $STATUS -ne 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bun-audit-report
          path: audit-output.txt
          retention-days: 30

      - name: Create or update issue if vulnerabilities found
        if: steps.audit.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditOutput = fs.readFileSync('audit-output.txt', 'utf8');
            const title = '🔒 セキュリティ監査: 脆弱性が検出されました';
            const marker = '<!-- security-audit-issue -->';
            
            const body = `${marker}
            
            ## 🔒 セキュリティ監査結果
            
            **実行日時**: ${new Date().toISOString()}
            
            ### ⚠️ 脆弱性が検出されました
            
            \`bun audit\` により、依存関係に既知の脆弱性が見つかりました。
            
            <details>
            <summary>詳細出力を表示</summary>
            
            \`\`\`
            ${auditOutput.slice(0, 60000)}
            \`\`\`
            
            </details>
            
            ### 対応方法
            
            1. \`bun audit\` を実行して詳細を確認
            2. 可能であれば \`bun update\` で依存関係を更新
            3. 更新できない場合は、代替パッケージの検討や影響範囲の評価を実施
            
            ---
            *このissueは週次のセキュリティ監査により自動作成・更新されます。*
            `;
            
            // 既存のissueを検索
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
              per_page: 100,
            });
            
            const existingIssue = issues.find(issue => issue.body?.includes(marker));
            
            if (existingIssue) {
              // 既存のissueを更新
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body,
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // 新しいissueを作成
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'dependencies'],
              });
              console.log(`Created new issue #${newIssue.number}`);
            }

      - name: Close issue if no vulnerabilities
        if: steps.audit.outputs.has_vulnerabilities == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- security-audit-issue -->';
            
            // 既存のissueを検索
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
              per_page: 100,
            });
            
            const existingIssue = issues.find(issue => issue.body?.includes(marker));
            
            if (existingIssue) {
              // issueをクローズ
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: '✅ 脆弱性が解消されました。このissueを自動クローズします。',
              });
              
              console.log(`Closed issue #${existingIssue.number}`);
            }

