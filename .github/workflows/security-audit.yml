name: Security Audit

on:
  schedule:
    # 毎週月曜日の朝9時（JST）に実行 = UTC 0:00（月曜日）
    - cron: '0 0 * * 1'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: read
  issues: write

env:
  BUN_VERSION: "1.4.0"

jobs:
  bun-audit:
    name: Security Audit (bun audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun
            ~/.cache/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Save Bun cache
        if: steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun
            ~/.cache/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      # bun audit は脆弱性を検出すると非0で終わるので set +e で受ける。
      # 「検出したか」ではなく「人が見るべきものが残っているか」で分岐するため、
      # 終了コードは使わず次の Triage ステップの判定に委ねる。
      - name: Run bun audit
        id: audit
        run: |
          set +e
          bun audit > audit-output.txt 2>&1
          # JSON は機械判定用。人が読む用の audit-output.txt とは別に取る
          # （--json は依存経路を持たないため、issue 本文には両方載せる）。
          bun audit --json > audit-output.json 2>/dev/null
          set -e

      # 検出された advisory を .github/security-audit-allowlist.json と突き合わせ、
      # 「人が見るべきものが残っているか」だけを判定する。レビュー済み・ランタイム非到達と
      # 判断したものを毎週鳴らし続けると、本当に対応が要る advisory がその中に埋もれる
      # （派生プロダクトで「3件とも対応不要」の放置中に、ランタイム到達する hono の
      # CORS ReDoS が同じ出力に混ざっていた実例がある）。
      - name: Triage against allowlist
        id: triage
        run: node scripts/check/security-audit-triage.mjs audit-output.json

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bun-audit-report
          path: |
            audit-output.txt
            audit-output.json
          retention-days: 30

      - name: Create or update issue if vulnerabilities found
        if: steps.triage.outputs.actionable == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRIAGE_SUMMARY: ${{ steps.triage.outputs.summary }}
        with:
          script: |
            const fs = require('fs');
            const auditOutput = fs.readFileSync('audit-output.txt', 'utf8');
            const title = '🔒 セキュリティ監査: 脆弱性が検出されました';
            const marker = '<!-- security-audit-issue -->';
            
            const body = `${marker}
            
            ## 🔒 セキュリティ監査結果
            
            **実行日時**: ${new Date().toISOString()}
            
            ${process.env.TRIAGE_SUMMARY}

            <details>
            <summary>bun audit の生出力（依存経路つき）</summary>

            \`\`\`
            ${auditOutput.slice(0, 60000)}
            \`\`\`

            </details>

            ### 対応方法

            1. 上の「対応が必要な advisory」について、**そのパッケージが Cloudflare Worker の
               バンドルに入り、攻撃者が制御できる入力を処理するか**を確認する
            2. ランタイムに到達する → \`bun update <pkg>\` で修正版へ上げる（上げられなければ
               代替パッケージ・影響緩和を検討）。修正版が公開 3 日以内だと \`minimum release age\`
               で弾かれる — その場合だけ \`bunfig.toml\` の \`minimumReleaseAgeExcludes\` に
               理由付きで一時追加する
            3. ビルド・開発時にしか使わない → \`.github/security-audit-allowlist.json\` に
               GHSA ID・経路・判断・再確認期限を書いて登録する。**パッケージ単位ではなく
               advisory 単位**で、期限付きで登録すること（理由は同ファイルの \`$comment\`）

            ---
            *このissueは週次のセキュリティ監査により自動作成・更新されます。*
            *レビュー済み・対応不要と判断した advisory はここには出ません（allowlist で抑制）。*
            `;
            
            // 既存のissueを検索
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
              per_page: 100,
            });
            
            const existingIssue = issues.find(issue => issue.body?.includes(marker));
            
            if (existingIssue) {
              // 既存のissueを更新
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body,
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // 新しいissueを作成
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'dependencies'],
              });
              console.log(`Created new issue #${newIssue.number}`);
            }

      # 「脆弱性ゼロ」だけでなく「残りは全て allowlist 済み」でも閉じる。
      # 対応が済んだ（または全件トリアージし終えた）のに issue が開いたままだと、
      # security ラベルの issue が常設のノイズになり、次に本物が来ても目が滑る。
      - name: Close issue if nothing actionable
        if: steps.triage.outputs.actionable == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- security-audit-issue -->';
            
            // 既存のissueを検索
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
              per_page: 100,
            });
            
            const existingIssue = issues.find(issue => issue.body?.includes(marker));
            
            if (existingIssue) {
              // issueをクローズ
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: '✅ 脆弱性が解消されました。このissueを自動クローズします。',
              });
              
              console.log(`Closed issue #${existingIssue.number}`);
            }

