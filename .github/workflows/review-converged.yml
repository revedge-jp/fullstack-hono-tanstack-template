name: Review converged

# レビューが収束した PR だけをマージ対象にする。auto-merge / merge queue を使うと「CI 緑」だけで
# 入ってしまうため、ship.md の手順どおり /code-review を CONFIRMED ゼロまで回した証跡
# (本文の「レビュー収束:」行)を要求する。行は人が書くので偽装は可能だが、「書かずに通る」経路を塞ぐ。
#
# ci.yml と分けている理由: 収束行は最後の push の後に本文編集(edited)と Draft 解除
# (ready_for_review)で付くため、そのイベントで再評価が必要。ci.yml をそのイベントで回すと
# 本文を直すたびに CI 全体が走ってしまう。ルールセットはこの check(Review converged)も必須にする。
# merge_group では PR 本文を読めないので、そこでは無条件に success を返してキューを止めない。
#
# 検証器（ゲート・ガード・CI・フック・閾値。一覧は scripts/check/verifier-paths.txt）に触る PR に本文の
# 「## 検証器の変更理由」を求める判定もここで行う。エージェントがゲートに引っかかったとき「コードを直す」
# ではなく「ゲートを緩める」に流れるのを、編集時（Claude Code の PreToolUse フック）だけでなくマージ時にも
# 止める。ci.yml ではなくここに置くのは、理由を本文に書き足したとき（edited）に再評価させるため。

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  merge_group:

permissions: {}

jobs:
  review-converged:
    name: Review converged
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # 検証器の判定で PR の差分と base 側の判定スクリプトを読む
    steps:
      # merge commit（refs/pull/N/merge）と両親に加え、PR のコミットの作者を見るので全履歴を取る
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false

      # 限界: pull_request では PR 側のワークフロー定義が動くので、同じ PR でこのステップを消す・if を
      # 書き換えると判定は外れる（旧 ci.yml の verifier-change も同じ）。このファイル自体が検証器の一覧に
      # 入っているが、検証器に触る PR の手動マージは #175 で外したので、この書き換えを止める仕組みは無い。
      - name: 検証器の変更に理由があるか
        if: github.event_name == 'pull_request'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # 差分は merge commit とその第 1 親（merge を作った時点の base の先端）で取る。pull_request.base.sha は
          # synchronize のペイロードで古いままのことがあり、間に main に入った他 PR の変更まで拾う（#111 で発生）
          if ! git rev-parse -q --verify HEAD^2 >/dev/null; then
            echo "::error::HEAD が merge commit ではないため PR の差分を特定できません"; exit 1
          fi
          # Renovate の PR は検証器一覧に当たるファイル（package.json、.github/workflows/* の action digest）を
          # 触るが「検証器の緩和」ではないので対象外。ただし PR 作者だけで判定しない: bot が作った PR に
          # 人やエージェントが修正を push し、ついでに検証器を緩めると素通りする。PR のコミットが全部 bot の
          # ものであるときだけ外す。
          # 注意: エージェントが bot トークンで PR を作る運用（claude-code-action 等）を導入するなら、
          # その bot はこのゲートが本来止めたい対象なので、除外を renovate[bot] だけに絞ること。
          # merge commit（「Update branch」）は除いて数え、コミットが 0 件のときは対象外にしない（0 件だと grep が成立して素通りする）。
          # 作者名は自己申告なので、これは依存更新 bot の PR を通すための緩和で、悪意への防御ではない
          bot_commits_only() {
            [ -n "$(git log --no-merges --format='%an' HEAD^1..HEAD^2)" ] &&
              ! git log --no-merges --format='%an' HEAD^1..HEAD^2 | grep -qv '\[bot\]$'
          }
          if [[ "$AUTHOR" == *'[bot]' ]] && bot_commits_only; then
            echo "bot のコミットだけの PR は対象外"; exit 0
          fi
          # 判定には base 側（HEAD^1）の判定スクリプトと一覧を使う。PR 側のものを使うと、同じ PR で
          # スクリプトを「常に一致なし」に書き換えたり一覧から行を消したりして判定を外せる
          # （ワークフロー定義そのものの書き換えは、上のステップのコメントの限界）
          checker="$RUNNER_TEMP/verifier-check"
          mkdir -p "$checker"
          # base にまだ無いとき（高リスク領域の一覧を導入する PR）だけ PR 側のものを使う
          if git cat-file -e HEAD^1:scripts/check/is-verifier-path.sh 2>/dev/null &&
            git cat-file -e HEAD^1:scripts/check/verifier-paths.txt 2>/dev/null &&
            git cat-file -e HEAD^1:scripts/check/high-risk-paths.txt 2>/dev/null; then
            git show HEAD^1:scripts/check/is-verifier-path.sh > "$checker/is-verifier-path.sh"
            git show HEAD^1:scripts/check/verifier-paths.txt > "$checker/verifier-paths.txt"
            git show HEAD^1:scripts/check/high-risk-paths.txt > "$checker/high-risk-paths.txt"
          else
            echo "::notice::base に判定スクリプトまたは一覧が無いため、PR 側のものを使います（導入時のみ）"
            cp scripts/check/is-verifier-path.sh scripts/check/verifier-paths.txt scripts/check/high-risk-paths.txt "$checker/"
          fi
          # --no-renames で移動元と移動先の両方を出す。移動先の名前だけだと、knip.json → knip.disabled.json の
          # ような名前を変えただけの実質削除が一覧に当たらない
          # -z と core.quotepath=off で、日本語・空白を含む名前も 1 つのパスのまま渡す（$(git diff --name-only) の展開では、
          # 引用・エスケープされたり分かれたりして一覧に当たらない）。いったんファイルに書くのは、プロセス置換だと
          # git の失敗が捨てられて「変更なし」に見え、素通りするため
          git -c core.quotepath=off diff --no-renames -z --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.z"
          changed=()
          while IFS= read -r -d '' file; do changed+=("$file"); done < "$RUNNER_TEMP/changed.z"
          [ "${#changed[@]}" -eq 0 ] && { echo "変更なし"; exit 0; }
          failed=0
          if hits=$(bash "$checker/is-verifier-path.sh" "${changed[@]}"); then
            echo "検証器に当たる変更:"
            while IFS= read -r hit; do echo "  • $hit"; done <<< "$hits"
            if printf '%s' "$PR_BODY" | grep -q '^## 検証器の変更理由'; then
              echo "PR 本文に「## 検証器の変更理由」あり"
            else
              echo "::error::検証器(上記)を変更していますが、PR 本文に「## 検証器の変更理由」節がありません。閾値の引き下げ・除外の追加・ガードの削除がコードを直す代わりになっていないかを書いてください(一覧: scripts/check/verifier-paths.txt)。本文を直せばこの check は再実行されます"
              failed=1
            fi
          else
            echo "検証器の変更なし"
          fi
          # 高リスク領域（認証・テナント境界・マイグレーション等）は、ユーザーの確認を待たずに auto-merge する代わりに、
          # `e2e` ラベル（全 spec をその PR で回す）と本文の確認節を求める。有無だけを検査し、中身は ship.md の責任
          if risk=$(VERIFIER_PATHS_FILE="$checker/high-risk-paths.txt" bash "$checker/is-verifier-path.sh" "${changed[@]}"); then
            echo "高リスク領域に当たる変更:"
            while IFS= read -r hit; do echo "  • $hit"; done <<< "$risk"
            if ! printf '%s' "$LABELS_JSON" | jq -e 'index("e2e")' >/dev/null; then
              echo "::error::高リスク領域(上記)を変更していますが、PR に e2e ラベルがありません。gh pr edit <番号> --add-label e2e で全 spec を回してください(.claude/commands/ship.md「高リスク領域の機械条件」)"
              failed=1
            fi
            if ! printf '%s' "$PR_BODY" | grep -q '^## 高リスク領域の確認'; then
              echo "::error::高リスク領域(上記)を変更していますが、PR 本文に「## 高リスク領域の確認」節がありません。ship.md「高リスク領域の機械条件」の結果を書いてください"
              failed=1
            fi
          fi
          [ "$failed" = "0" ] || exit 1

      - name: PR 本文にレビュー収束の記録があるか
        # 検証器の判定が落ちても、こちらの結果も出す（両方を一度に直せるように）
        if: success() || failure()
        env:
          EVENT: ${{ github.event_name }}
          # actor(イベントを起こした人)ではなく PR 作者で判定する。bot の PR に人が本文編集すると
          # actor が人になり、依存更新 PR が収束行を要求されて automerge が止まるため
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT" = "merge_group" ]; then echo "merge_group: PR 側の check で判定済み"; exit 0; fi
          case "$AUTHOR" in *'[bot]') echo "bot の PR は対象外"; exit 0 ;; esac
          if printf '%s' "$PR_BODY" | grep -qE '^レビュー収束: .*CONFIRMED 0'; then
            echo "レビュー収束の記録あり"; exit 0
          fi
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::notice::Draft のため未収束でよい。収束したら本文に「レビュー収束: 最終周 CONFIRMED 0」を書き、gh pr ready で解除する"
          fi
          echo "::error::PR 本文に「レビュー収束: 最終周 CONFIRMED 0」の行がありません。/code-review を CONFIRMED ゼロまで回してから、ship.md の手順で本文に記録してください"
          exit 1
