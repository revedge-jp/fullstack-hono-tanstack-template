name: Deploy

# CI Pipeline (ci.yml) の完了を待って、成功した場合のみ deploy する。
# workflow_run はタグ push でトリガーされた実行でも head_branch にタグ名(refs/tags/ 抜き)が
# 入る仕様のため、ブランチ判定とタグ判定はどちらも head_branch を見れば区別できる。
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  detect-target:
    name: Detect deploy target
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    outputs:
      target: ${{ steps.detect.outputs.target }}
    steps:
      # ci.yml の push トリガー(branches: [main], tags: 'v*.*.*')に対応する正規表現でのみ
      # staging/production を判定する。それ以外の head_branch では deploy しない。
      - name: Detect target from head_branch
        id: detect
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$HEAD_BRANCH" = "main" ]; then
            echo "target=staging" >> "$GITHUB_OUTPUT"
          elif [[ "$HEAD_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=none" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Cloudflare Workers
    needs: detect-target
    if: needs.detect-target.outputs.target != 'none'
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-target.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # テンプレート原本リポジトリ（scripts/init-template.sh 未実行 = wrangler.jsonc が
      # {{APP_NAME}} のまま、かつ Cloudflare/DB の secrets 未設定）では、この先の
      # build/migrate/deploy が構造的に必ず失敗する。実プロジェクト化 + secrets 設定が
      # 揃うまでは赤い失敗にせず、後続 step を skip する。
      - name: Check deploy readiness
        id: readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if grep -q '{{APP_NAME}}' apps/client/wrangler.jsonc; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/client/wrangler.jsonc still has the {{APP_NAME}} placeholder. Run scripts/init-template.sh <app-name> to enable deployment. Skipping deploy."
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$DATABASE_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / DATABASE_URL is not fully configured. Skipping deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-workspace
        if: steps.readiness.outputs.ready == 'true'

      - name: Build
        if: steps.readiness.outputs.ready == 'true'
        run: bun run build

      - name: Migrate DB (staging)
        if: steps.readiness.outputs.ready == 'true' && needs.detect-target.outputs.target == 'staging'
        run: cd packages/database && bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy (staging)
        if: steps.readiness.outputs.ready == 'true' && needs.detect-target.outputs.target == 'staging'
        run: cd apps/client && bunx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # デプロイ直後の稼働確認。失敗したらこのジョブを赤にする
      # （production はタグ push で別途デプロイされるため、ここが赤のうちはタグを切らないこと）。
      # SMOKE_BASE_URL は GitHub Environment (staging) の Variables に設定する。
      - name: Smoke check (staging)
        if: steps.readiness.outputs.ready == 'true' && needs.detect-target.outputs.target == 'staging'
        run: bash scripts/check/post-deploy-smoke.sh "${{ vars.SMOKE_BASE_URL }}"

      - name: Migrate DB (production)
        if: steps.readiness.outputs.ready == 'true' && needs.detect-target.outputs.target == 'production'
        run: cd packages/database && bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy (production)
        if: steps.readiness.outputs.ready == 'true' && needs.detect-target.outputs.target == 'production'
        run: cd apps/client && bunx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # SMOKE_BASE_URL は GitHub Environment (production) の Variables に設定する。
      - name: Smoke check (production)
        if: steps.readiness.outputs.ready == 'true' && needs.detect-target.outputs.target == 'production'
        run: bash scripts/check/post-deploy-smoke.sh "${{ vars.SMOKE_BASE_URL }}"
