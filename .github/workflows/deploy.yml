name: Deploy

# CI Pipeline (ci.yml) の完了を待って、成功した場合のみ deploy する。
# workflow_run はタグ push でトリガーされた実行でも head_branch にタグ名(refs/tags/ 抜き)が
# 入る仕様のため、ブランチ判定とタグ判定はどちらも head_branch を見れば区別できる。
#
# デプロイ本体は Alchemy（alchemy.run.ts）。PlanetScale DB / Role / Hyperdrive / Worker を
# IaC として reconcile する。マイグレーション順序を守るため 2 段実行:
#   1) SKIP_WORKER=1 で DB/Hyperdrive を provision（DATABASE_URL が GITHUB_ENV に入る）
#   2) drizzle-kit migrate
#   3) Worker デプロイ
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

# デフォルトは権限なし。必要な権限は各ジョブで最小限だけ付与する。
permissions: {}

jobs:
  detect-target:
    name: Detect deploy target
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    # Environment 存在チェック（gh api）に actions: read が必要
    # （environments の GET は fine-grained では Actions (read) にマップされる）。
    # contents: read は main に含まれるコミットかの確認（compare API）に使う。
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    outputs:
      target: ${{ steps.detect.outputs.target }}
    steps:
      # ci.yml の push トリガー(branches: [main], tags: 'v*.*.*')に対応する正規表現でのみ
      # staging/production を判定する。それ以外の head_branch では deploy しない。
      #
      # さらに、対応する GitHub Environment が存在しない場合は target=none にして deploy job を
      # スキップする。deploy job の `environment:` は「存在しない Environment + 制限付きトークン
      # （workflow の permissions: {}）」の組み合わせだとステップ実行前にサイレントに失敗するため、
      # job 内の readiness チェックでは救えない（テンプレート原本や setup-deploy-env.sh 未実行の
      # 派生リポジトリを赤い失敗にしないための、ジョブ手前でのガード）。
      - name: Detect target from head_branch
        id: detect
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HEAD_BRANCH" = "main" ]; then
            target=staging
          elif [[ "$HEAD_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            target=production
          else
            target=none
          fi
          if [ "$target" != "none" ]; then
            # 404（未作成）だけを skip 扱いにする。403 等（トークン権限不足など）まで skip に
            # 倒すと「設定済みなのに永久にデプロイされない」事故になるため、明示的に失敗させる。
            if out=$(gh api "repos/$GITHUB_REPOSITORY/environments/$target" 2>&1 >/dev/null); then
              : # Environment あり → デプロイ続行
            elif echo "$out" | grep -q "HTTP 404"; then
              echo "::notice::GitHub Environment '$target' が未作成のため deploy を skip します。有効化するには: bash scripts/setup-deploy-env.sh $target"
              target=none
            else
              echo "::error::Environment '$target' の存在確認に失敗しました: $out"
              exit 1
            fi
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

      # デプロイするコミットが main に含まれるか確かめる。ブランチに push できる人はタグも push でき、
      # 未マージのコミットに vX.Y.Z を付けると CI → この workflow_run が production の資格情報でその
      # コミットを checkout して動かしてしまう（Environment のデプロイ元制限は、workflow_run が main 上の
      # ジョブとして動くので効かない）。main が含んでいる（identical / ahead）ときだけ通し、それ以外
      # （diverged / behind / 存在しない）はジョブを失敗させて目に見える形で止める。
      # 比較先は refs/heads/main と完全修飾で書く（main という名前のタグを push されると、裸の main はタグに解決されうる）。
      - name: Verify the commit is on main
        if: steps.detect.outputs.target != 'none'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD_SHA...refs/heads/main" --jq .status 2>&1); then
            echo "::error::$HEAD_SHA と main の比較に失敗しました（main に無いコミットの可能性）: $status"
            exit 1
          fi
          case "$status" in
            identical|ahead) echo "$HEAD_SHA は main に含まれています（$status）" ;;
            *)
              echo "::error::$HEAD_SHA は main に含まれていません（$status）。マージ前のコミットはデプロイしません"
              exit 1 ;;
          esac

  deploy:
    name: Deploy (Alchemy)
    needs: detect-target
    if: needs.detect-target.outputs.target != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # デプロイターゲット（staging / production）ごとに直列化し、同一 stage への
    # 並行デプロイが Alchemy state を奪い合う（reconcile 競走）のを防ぐ。
    # 別 stage は並行してよいので group にターゲットを含める。ジョブレベル concurrency は
    # needs コンテキストを参照できる（ワークフローレベルは github.* しか使えない）。
    concurrency:
      group: deploy-${{ needs.detect-target.outputs.target }}
      cancel-in-progress: false
    environment: ${{ needs.detect-target.outputs.target }}
    permissions:
      contents: read
    env:
      # Alchemy（alchemy.run.ts）が参照する環境変数。
      # APP_NAME / WORKERS_SUBDOMAIN / APP_ORIGIN / CUSTOM_DOMAIN / EDGE_RATE_LIMIT_RPM は
      # Environment Variables、それ以外は Environment Secrets。
      APP_NAME: ${{ vars.APP_NAME }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      # オプション機能（未設定なら無効 — alchemy.run.ts のコメント参照）
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      EDGE_RATE_LIMIT_RPM: ${{ vars.EDGE_RATE_LIMIT_RPM }}
      LOGPUSH_DESTINATION: ${{ secrets.LOGPUSH_DESTINATION }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
      PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      DEPLOY_TARGET: ${{ needs.detect-target.outputs.target }}
      # /api/health が返すビルド情報（alchemy.run.ts が Worker にバインドする）。
      # head_branch はタグ push なら "vX.Y.Z"、main push なら "main"。
      GIT_SHA: ${{ github.event.workflow_run.head_sha }}
      APP_VERSION: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # git push はしない。rollback の fetch は下で明示的にトークン付き URL を使う。
          persist-credentials: false

      # テンプレート原本リポジトリ（secrets/vars 未設定）では build/deploy が構造的に必ず
      # 失敗する。実プロジェクト化 + 設定が揃うまでは赤い失敗にせず、後続 step を skip する。
      - name: Check deploy readiness
        id: readiness
        run: |
          missing=""
          [ -z "$APP_NAME" ] && missing="$missing APP_NAME(var)"
          [ -z "$CUSTOM_DOMAIN" ] && [ -z "$APP_ORIGIN" ] && [ -z "$WORKERS_SUBDOMAIN" ] && missing="$missing CUSTOM_DOMAIN|APP_ORIGIN|WORKERS_SUBDOMAIN(var)"
          [ -z "$ALCHEMY_PASSWORD" ] && missing="$missing ALCHEMY_PASSWORD"
          [ -z "$ALCHEMY_STATE_TOKEN" ] && missing="$missing ALCHEMY_STATE_TOKEN"
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$PLANETSCALE_ORGANIZATION" ] && missing="$missing PLANETSCALE_ORGANIZATION(var)"
          [ -z "$PLANETSCALE_SERVICE_TOKEN_ID" ] && missing="$missing PLANETSCALE_SERVICE_TOKEN_ID"
          [ -z "$PLANETSCALE_SERVICE_TOKEN" ] && missing="$missing PLANETSCALE_SERVICE_TOKEN"
          [ -z "$BETTER_AUTH_SECRET" ] && missing="$missing BETTER_AUTH_SECRET"
          [ -z "$GOOGLE_CLIENT_ID" ] && missing="$missing GOOGLE_CLIENT_ID"
          [ -z "$GOOGLE_CLIENT_SECRET" ] && missing="$missing GOOGLE_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy secrets/vars not fully configured:$missing — skipping deploy. See docs/deploy/cloudflare-workers.md"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # smoke 失敗時の戻り先は「このデプロイの前に実際に動いていた版」。GitHub の Deployment レコードは
      # 使わない — workflow_run の run では記録される sha が main の先端になり、タグを打った commit とずれる。
      # 何もデプロイしなかった run（readiness=false）も success として残る。
      # 読むのは DB に依存しない /api/health/live（DB の一時的な遅延で戻り先を失わない）。commit が 40 桁の SHA で、
      # main に含まれるときだけ記録する（戻り先はこの environment の資格情報でビルド・デプロイされるので、
      # detect-target と同じく main に無い commit は動かさない）。
      - name: Record running version (rollback target)
        id: running
        if: steps.readiness.outputs.ready == 'true' && vars.SMOKE_BASE_URL != ''
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          sha=""
          for attempt in 1 2 3; do
            body=$(curl -fsS --max-time 10 "${SMOKE_BASE_URL%/}/api/health/live" || true)
            sha=$(printf '%s' "$body" | jq -r 'select(.status == "ok") | .commit // empty' 2>/dev/null || true)
            [ -n "$sha" ] && break
            [ "$attempt" -lt 3 ] && sleep 5
          done
          # grep -x は行ごとに判定するので、改行を含む値の 1 行目だけで通ってしまう。文字列全体で判定する
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::notice::稼働中の版を特定できませんでした（初回デプロイ・停止中・手動デプロイで commit が dev 等）。このデプロイの smoke が失敗しても自動ロールバックはできません"
            exit 0
          fi
          status=""
          for attempt in 1 2 3; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...refs/heads/main" --jq .status 2>/dev/null) && break
            status=""
            [ "$attempt" -lt 3 ] && sleep 5
          done
          case "$status" in
            identical|ahead)
              # 稼働中より古い commit を新しく出さない（main 上の古い commit にタグを打つと production が戻る）。
              # 意図した巻き戻しは過去の Deploy run の rerun（run_attempt が 2 以上）で行うので、それは止めない。
              # 比べられないとき（compare の失敗）は、デプロイ自体は止めずに進める
              if [ "$RUN_ATTEMPT" = "1" ] && order=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$GIT_SHA" --jq .status 2>/dev/null) && [ "$order" = "behind" ]; then
                echo "::error::デプロイしようとしている $GIT_SHA は稼働中の $sha より古い commit です。巻き戻すなら、戻りたい版の Deploy run を rerun してください（docs/deploy/operations.md の「手動ロールバック」）"
                exit 1
              fi
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "smoke 失敗時の戻り先: $sha" ;;
            "") echo "::warning::稼働中の $sha が main に含まれるかを確かめられませんでした（compare API の失敗）。このデプロイの smoke が失敗しても自動ロールバックはできません" ;;
            *) echo "::warning::稼働中の $sha は main に含まれない（$status）ため、ロールバックの戻り先にしません" ;;
          esac

      - uses: ./.github/actions/setup-workspace
        if: steps.readiness.outputs.ready == 'true'

      # テンプレート原本では wrangler.jsonc の name が APP_NAME プレースホルダーのままで、
      # vite build（@cloudflare/vite-plugin の config 検証）が落ちる。APP_NAME 変数で
      # 置換してからビルドする（init-template.sh 適用済みのリポジトリでは no-op）。
      - name: Materialize APP_NAME placeholder
        if: steps.readiness.outputs.ready == 'true'
        run: perl -pi -e 's/\{\{APP_NAME\}\}/$ENV{APP_NAME}/g' apps/client/wrangler.jsonc

      - name: Build
        if: steps.readiness.outputs.ready == 'true'
        run: bun run build

      # ① DB / Role / Hyperdrive を provision（Worker は更新しない）。
      # alchemy.run.ts が DATABASE_URL を GITHUB_ENV に export する（ログにはマスクのみ）。
      - name: Provision infra (DB / Hyperdrive)
        if: steps.readiness.outputs.ready == 'true'
        run: bunx alchemy deploy --stage "$DEPLOY_TARGET"
        env:
          SKIP_WORKER: "1"

      # ② 新コードが動き出す前にスキーマを揃える
      - name: Migrate DB
        if: steps.readiness.outputs.ready == 'true'
        run: cd packages/database && bun run db:migrate

      # ③ Worker デプロイ
      - name: Deploy Worker
        if: steps.readiness.outputs.ready == 'true'
        run: bunx alchemy deploy --stage "$DEPLOY_TARGET"

      # デプロイ直後の稼働確認。失敗したらこのジョブを赤にする
      # （production はタグ push で別途デプロイされるため、ここが赤のうちはタグを切らないこと）。
      # SMOKE_BASE_URL は GitHub Environment の Variables に設定する。
      - name: Smoke check
        id: smoke
        if: steps.readiness.outputs.ready == 'true'
        run: bash scripts/check/post-deploy-smoke.sh "${{ vars.SMOKE_BASE_URL }}"

      # smoke 失敗時は、デプロイ前に動いていた版（Record running version で記録した commit）を
      # 再ビルドして再デプロイする（壊れた版を出しっぱなしにしない）。ロールバック後もジョブは赤のまま
      # 残る（失敗の可視化のため）。
      # `wrangler rollback` は使えない — Alchemy のデプロイは上書き型で CF 側にバージョン
      # 履歴が残らない（実地訓練で確認済み）。
      # DB スキーマは戻さない — expand/contract 規律（docs/deploy/operations.md）が
      # 「旧コード + 新スキーマ」の安全性を担保する。
      - name: Rollback on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GOOD_SHA: ${{ steps.running.outputs.sha }}
        run: |
          good_sha="$GOOD_SHA"
          if [ -z "$good_sha" ]; then
            echo "::error::デプロイ前に稼働中の版を特定できなかったためロールバックできません（初回デプロイ・直前から停止中など）。手動対応してください: docs/deploy/operations.md"
            exit 1
          fi
          echo "==> Rolling back to $good_sha ..."
          # checkout は persist-credentials: false のため origin に認証情報が残っていない。
          # トークン付き URL で該当 commit だけを明示的に fetch する。
          git fetch --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$good_sha"
          git checkout --force "$good_sha"
          bun install --frozen-lockfile
          perl -pi -e 's/\{\{APP_NAME\}\}/$ENV{APP_NAME}/g' apps/client/wrangler.jsonc
          bun run build
          # /api/health のビルド情報をロールバック先の commit に合わせる
          export GIT_SHA="$good_sha"
          export APP_VERSION="rollback-${good_sha}"
          bunx alchemy deploy --stage "$DEPLOY_TARGET"
          echo "==> Rollback deploy 完了（$good_sha）。ロールバック版の稼働を再確認します。"
          # ロールバック版が実際に healthy かを smoke で再検証する（壊れた版へ戻していないか確認）。
          # 元のデプロイ失敗を隠さないため、結果に関わらずこのジョブは失敗のまま残す。
          if bash scripts/check/post-deploy-smoke.sh "${{ vars.SMOKE_BASE_URL }}"; then
            echo "::notice::ロールバック版（$good_sha）は smoke 通過。ただし元デプロイが失敗したためジョブは赤のままにします。"
          else
            echo "::error::ロールバック版（$good_sha）の smoke も失敗しました。手動対応が必要です: docs/deploy/operations.md"
          fi
