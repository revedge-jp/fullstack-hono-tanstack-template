name: deploy-prod
# 初期状態では無効化されています
# 有効化する場合は、以下のコメントアウトを解除してください
# on:
#   push:
#     tags: ['v*']
on:
  workflow_dispatch: # 手動実行のみ可能（デフォルトは無効）

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      commit_sha: ${{ github.sha }}
      prefix: ${{ vars.PREFIX }}
      GCP_PROJECT_ID: ${{ vars.PRD_GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ vars.PRD_WIF_PROVIDER }}
      WIF_SA: ${{ vars.PRD_WIF_SA }}
      TFSTATE_BUCKET: ${{ vars.PRD_TFSTATE_BUCKET }}
      load_balancer_domain: ${{ vars.PRD_LOAD_BALANCER_DOMAIN }}
    secrets:
      DB_PASSWORD: ${{ secrets.PRD_DB_PASSWORD }}
