name: Claude Implementation

# Trigger: comment "@claude" on an issue (MEMBER or OWNER only)
# Prerequisites: Secrets に ANTHROPIC_API_KEY、Variables に CLAUDE_TRUSTED_ACTORS
#   (プロンプトに含めてよいコメント投稿者のログインをカンマ区切りで。例: alice,bob,claude[bot])。
#   変数が空だと action は全コメントを含める(fail-open)ため、未設定ならジョブ自体を起動しない。
#
# セキュリティ前提(背景と「Rule of Two」は .claude/rules/general.md を参照):
#   (1) コメント投稿者と issue 作者を MEMBER/OWNER に限定 — issue 本文が第三者由来にならない
#   (2) include_comments_by_actor(= vars.CLAUDE_TRUSTED_ACTORS)でプロンプトに入るコメントを
#       列挙したログインに限定 — action は既定で issue の全コメント(最大100件)をプロンプトに
#       含めるため、公開リポジトリでは (1) だけでは第三者のコメントが読まれる。
#       author_association による動的絞り込みは無いので、メンバーが増えたら変数を更新する
#   (3) action は commit SHA でピン留めし、修正版(2026-01-16)より新しいものだけを使う
#   (4) `id-token: write` は付与しない。permissions は必要最小限
#   参考: https://labs.cloudsecurityalliance.org/research/csa-research-note-claude-code-github-action-prompt-injection/

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

# 同一 issue / PR に @claude が連投されたら古い実行をキャンセルし、最新の指示だけを走らせる。
concurrency:
  group: claude-implement-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-implement:
    name: Claude Implementation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      vars.CLAUDE_TRUSTED_ACTORS != '' &&
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER') &&
      (github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'OWNER')
    steps:
      # このワークフローは実装をコミット/プッシュするため persist-credentials は既定（true）のまま。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1.0.213
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          include_comments_by_actor: ${{ vars.CLAUDE_TRUSTED_ACTORS }}
