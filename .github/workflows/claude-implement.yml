name: Claude Implementation

# Trigger: comment "@claude" on an issue (MEMBER or OWNER only)
# Prerequisites: ANTHROPIC_API_KEY secret must be configured in repository settings.
#
# セキュリティ前提(2026年上期に実証された攻撃クラスへの対処):
#   CVE-2026-24887 / PromptPwnd / GitInject — 公開 issue の本文に仕込んだ間接プロンプト
#   インジェクションで、エージェントに CI の資格情報(OIDC トークン等)を読ませ write 権限を
#   奪う攻撃が複数プロバイダで実証された。原因はモデルではなく「CI の資格情報と信頼できない
#   入力を同時にエージェントへ渡す」構成にある。対策:
#   (1) コメント投稿者だけでなく issue 作者も MEMBER/OWNER に限定する
#       (エージェントが読む issue 本文が第三者由来にならないようにする)
#   (2) action は commit SHA でピン留めし、修正版(2026-01-16)より新しいものだけを使う
#   (3) `id-token: write` は付与しない
#   (4) permissions は必要最小限(contents/issues/pull-requests の write は実装 PR 作成に必須)
#   参考: https://labs.cloudsecurityalliance.org/research/csa-research-note-claude-code-github-action-prompt-injection/

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

# 同一 issue / PR に @claude が連投されたら古い実行をキャンセルし、最新の指示だけを走らせる。
concurrency:
  group: claude-implement-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-implement:
    name: Claude Implementation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER') &&
      (github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'OWNER')
    steps:
      # このワークフローは実装をコミット/プッシュするため persist-credentials は既定（true）のまま。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1.0.213
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
