name: Claude Implementation

# Trigger: comment "@claude" on an issue (MEMBER or OWNER only)
# Prerequisites: ANTHROPIC_API_KEY secret must be configured in repository settings.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

# 同一 issue / PR に @claude が連投されたら古い実行をキャンセルし、最新の指示だけを走らせる。
concurrency:
  group: claude-implement-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-implement:
    name: Claude Implementation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER')
    steps:
      # このワークフローは実装をコミット/プッシュするため persist-credentials は既定（true）のまま。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: anthropics/claude-code-action@26ec041249acb0a944c0a47b6c0c13f05dbc5b44 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
