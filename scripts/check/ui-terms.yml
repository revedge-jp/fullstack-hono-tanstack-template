# 画面の文言の表記の辞書（textlint-rule-prh）。scripts/check/ui-copy.mjs が client の日本語文字列に当てる。
# 出典は SmartHR Design System の「用字用語」「ライティングのガイドライン」と、このアプリで決めた用語
# （.claude/rules/client.md「UI 文言の書き方」）。docs の文章には当てない（docs は lint:prose の .textlintrc.json）。
#
# 足すときは、置き換え先が 1 つに決まる語だけにする。文脈で正解が変わる語（「コピー」は複製とクリップボードの
# 両方がある等）は入れず、レビューで見る。
version: 1
rules:
  # このアプリで決めた用語
  - expected: サインイン
    pattern: ログイン
    prh: このアプリは「サインイン」で統一している。同じものを別の言葉で呼ばない
  - expected: サインアウト
    pattern: ログアウト
    prh: このアプリは「サインアウト」で統一している。同じものを別の言葉で呼ばない

  # 操作を表す語
  - expected: 押す
    pattern: '/クリック|タップ/'
    prh: ボタンは「押す」、リンクは「開く」と書く（PC とスマートフォンの両方で通じる言葉にする）
  - expected: 並べ替え
    pattern: '/並び替え|並べ変え/'
  - expected: 書き出す
    pattern: '/エクスポート/'
    prh: 外へデータを出す操作は「書き出す」と書く
  - expected: 取り込む
    pattern: '/インポート/'
    prh: 外からデータを入れる操作は「取り込む」と書く
  - expected: 展開
    pattern: 解凍
    prh: ZIP ファイルの中身を取り出す操作は「展開」と書く
  - expected: '$1に戻る'
    pattern: '/(ホーム|一覧|トップ|画面|ページ)へ戻る/'
    prh: 移動先が具体的な場所なら「に」、前後のような相対的な位置なら「へ」を使う

  # 冗長な言い回し・重ねた敬語
  - expected: でき
    pattern: '/することができ/'
    prh: 「〜することができます」は「〜できます」と書く
  - expected: し
    pattern: '/させていただ/'
    prh: 「〜させていただきました」は「〜しました」と書く（敬語を重ねない）
  - expected: 確認してください
    pattern: '/ご?確認いただけますよう(?:お願い(?:いた)?します)?/'
    prh: 敬語を重ねない
  - expected: する
    pattern: '/を(?:行|おこな)(?:う|います|いました)/'
    prh: 「削除を行う」ではなく「削除する」と書く

  # 表記
  - expected: か所
    pattern: '/箇所|個所/'
  - expected: か月
    pattern: '/[ヶカケ箇]月/'
  - expected: …
    pattern: '/\.{3}|。。。|・・・|……/'
    prh: 三点リーダーは「…」を 1 つだけ使う
  - expected: '$1：'
    pattern: '/([ぁ-んァ-ヶ一-龠々ー]) ?: ?/'
    prh: 画面の文言では記号を全角にする（「例：」）
  - expected: '（$1）'
    pattern: '/\(([^()]*[ぁ-んァ-ヶ一-龠々ー][^()]*)\)/'
    prh: 画面の文言では括弧を全角にする
  - expected: '$1！'
    pattern: '/([ぁ-んァ-ヶ一-龠々ー])!(?![!?])/'
    prh: 「！」は単独なら全角にする（「!?」「!!」の組は半角）
  - expected: '$1？'
    pattern: '/([ぁ-んァ-ヶ一-龠々ー])\?(?![!?])/'
    prh: 「？」は単独なら全角にする（「!?」「!!」の組は半角）
  # ja-spacing の ja-space-after-question / exclamation は半角の空白しか見ないので、空白が無い形はここで見る
  - expected: '$1　'
    pattern: '/([？！])(?=[^　\s」』）］】、。？！…])/'
    prh: 「？」「！」の後に文が続くときは全角の空白を入れる（「削除しますか？　この操作は元に戻せません。」）
  - expected: ｜
    pattern: '/ ?\| ?/'
    prh: 区切りは全角の縦棒にし、前後に空白を入れない（ページの title は「画面名｜アプリ名」）
  - expected: "{移動先の名前}"
    pattern: こちら
    prh: リンクの文言は移動先が分かる言葉にする（「詳しくはこちら」ではなく「よくある質問」）
