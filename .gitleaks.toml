# gitleaks の設定（lefthook の pre-commit と CI の secret-scan が読む）
# https://github.com/gitleaks/gitleaks
[extend]
useDefault = true

[allowlist]
description = "テスト用ダミー値・CI のダミー環境変数・ドキュメント上の例は検知対象から外す"
paths = [
  # テストコードと補助（認証のダミー secret や固定トークンが入る）
  '''(^|/)(__tests__|test-helpers|test-auth)/''',
  '''\.(test|int\.test|contract\.test|spec)\.[cm]?[jt]sx?$''',
  # CI のダミー環境変数（BETTER_AUTH_SECRET 等のテスト用の値）
  '''^\.github/workflows/''',
  # プレースホルダを置くファイルとドキュメント
  '''(^|/)\.env\.example$''',
  '''^README\.md$''',
  '''^docs/''',
]
regexes = [
  # キー名の定数（値ではなく metadata のキー名）
  '''TAX_RATE_METADATA_KEY''',
]
