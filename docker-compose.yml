services:
  postgres:
    image: postgres:18
    container_name: ${POSTGRES_CONTAINER_NAME:-app_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      # 127.0.0.1 バインド必須: 既定の "port:5432" は 0.0.0.0 公開で、同一 LAN
      # （共有 Wi-Fi 等）から postgres/postgres のスーパーユーザー接続が通ってしまう
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      # postgres:18 は VOLUME を /var/lib/postgresql に移し、PGDATA は
      # /var/lib/postgresql/18/docker（バージョン付きサブディレクトリ）を既定とする。
      # したがって named volume は親の /var/lib/postgresql にマウントするのが正しい
      # （旧 17 以前の /var/lib/postgresql/data ではない）。
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${PGADMIN_CONTAINER_NAME:-app_pgadmin}
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      # SERVER_MODE=False（認証なし）のため、ループバック限定公開は特に重要
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  postgres-test:
    image: postgres:18
    container_name: ${POSTGRES_TEST_CONTAINER_NAME:-app_postgres_test}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "127.0.0.1:${TEST_DATABASE_PORT:-5433}:5432"
    # テスト用 DB は使い捨て。named volume を持たず（コンテナの書き込みレイヤーのみ）、
    # docker compose down / rm でデータごと破棄する。永続化が必要なテストは無いため意図的。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-app-postgres-data}
  pgadmin-data:
    name: ${PGADMIN_VOLUME_NAME:-app-pgadmin-data}
